decision:
  real_gap: "Legal bounded attitude command, hardened oracle A true, B_preventive=0 with GCS_COMMAND excluded, and at least one cell has >= robust_min_clean_unsafe_per_cell clean-unsafe runs."
  soft_oracle: "The v2 unsafe region recovers under hardened oracle A, or no legal pressure escalation produces hardened A."
  bug_side: "Hardened oracle A true only with flight-controller preventive B before the hard consequence."
