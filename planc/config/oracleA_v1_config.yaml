    r_deg_s: [120.0, 180.0, 240.0, 300.0, 360.0, 420.0, 480.0, 540.0, 600.0]
    seeds: [0, 1, 2, 3, 4]
    wind_m_s: 0.0
    turbulence_m_s: 0.0
    angle_max_cd: 4500
    model: m100
  escalation_if_soft:
    - name: higher_r
      layer: high_r
      r_deg_s: [720.0, 960.0, 1200.0, 1500.0]
      seeds: [0, 1, 2, 3, 4]
      wind_m_s: 0.0
      turbulence_m_s: 0.0
      angle_max_cd: 4500
      model: m100
    - name: lower_twr
      layer: lower_twr_m170
      r_deg_s: [720.0, 960.0, 1200.0]
      seeds: [0, 1, 2, 3, 4]
      wind_m_s: 0.0
