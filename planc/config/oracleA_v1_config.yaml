experiment:
  name: control_authority_oracleA_v1
  version: oracleA_v1
  artifact_stem: oracleA_v1
  run_prefix: oracleAv1
  date: "2026-06-15"
  source_stage0_tag: planc/ctrlauth-stage0-v2-20260615
  source_island_tag: planc/ctrlauth-island-v1-20260615
  source_stage0_result: planc/results/stage0_v2_result.json
  source_island_result: planc/results/island_v1_result.json
  home:
    lat: 37.4275
    lon: -122.1697
    alt_m: 16.0
    yaw_deg: 90.0
  takeoff_alt_m: 45.0
  stream_hz: 50
  speedup: 8
